name: images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel --out-dir dist
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push base images
        run: |
          version="$(uv run --frozen python -c 'import bioengbench; print(bioengbench.__version__)')"
          for kind in agent grader; do
            image="ghcr.io/${{ github.repository_owner }}/bioengbench-${kind}-base:${version}"
            docker build -f "docker/${kind}-base.Dockerfile" -t "${image}" .
            docker push "${image}"
          done
