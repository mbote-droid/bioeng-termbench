schema_version = "1.3"
source = "https://github.com/mbote-droid/bioeng-termbench"
artifacts = ["/app/controller.py"]

[task]
name = "bioeng-termbench/t03-glucose-closed-loop"
authors = [{ name = "Samuel Ngigi Mbote", email = "mbotesamuel9@gmail.com" }]
description = "Write a closed-loop insulin controller (artificial pancreas) that keeps hidden virtual type 1 diabetes patients in range through meals, exercise and sensor faults, tested software-in-the-loop."
keywords = ["control-systems", "kalman-filter", "pid", "artificial-pancreas", "safety", "biomedical-engineering"]

[metadata]
task_version = "1.0.0"
domain = "medical device control"
discipline = "biomedical engineering"
skills = ["feedback control", "state estimation", "fault handling", "safety constraints", "real-time I/O protocol"]
numerical_methods = ["Kalman filtering", "PID with anti-windup", "model-based prediction"]
difficulty = "hard"
difficulty_explanation = "A plain PID tracks glucose well but stacks insulin and causes hypoglycaemia on a large fraction of patients; passing needs estimation, artefact rejection, an insulin-on-board limit, predictive suspend and exercise handling, all without seeing the patient's parameters."
expected_expert_minutes = 120
reward = "binary: 1 only if every check passes on every hidden patient"

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

[environment]
cpus = 1
memory_mb = 4096
storage_mb = 4096
workdir = "/app"
